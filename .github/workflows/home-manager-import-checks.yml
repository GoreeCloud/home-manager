name: GoreeCloud Home Manager — import integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify Python availability
        run: python3 --version
      - name: Run dependency-free unit checks
        run: python3 -m unittest discover -s tests_goreecloud -p "test_*.py" -v
      - name: Verify this checkout's import invariants
        run: python3 tools/check_home_manager_import.py

  supported-python-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use upstream-pinned supported Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Verify pinned interpreter matches source contract
        run: |
          python -c 'import sys; from pathlib import Path; v=Path(".python-version").read_text().strip(); assert v == "3.14.10" and sys.version_info[:3] == (3,14,10), (v, sys.version)'
      - name: Compile selected backend modules without importing them
        run: |
          python -m py_compile homeassistant/__main__.py homeassistant/const.py
          python -m py_compile homeassistant/components/assist_pipeline/audio_enhancer.py homeassistant/components/assist_pipeline/audio_compat.py
      - name: Recheck dependency-free imported-source assertions
        run: |
          python -m unittest discover -s tests_goreecloud -p "test_*.py" -q
          python tools/check_home_manager_import.py

  package-metadata-smoke:
    # Only run source packaging for manually dispatched jobs or first-party branches.
    # Never execute unreviewed fork changes as build backend code.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source with no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select upstream-pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Download and verify pinned build backend
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/build-deps" "$RUNNER_TEMP/wheels"
          python -m pip download --no-deps --only-binary=:all: setuptools==84.0.0 --dest "$RUNNER_TEMP/build-deps"
          python -c 'import os,hashlib; from pathlib import Path; d=Path(os.environ["RUNNER_TEMP"])/"build-deps"; p=list(d.glob("setuptools-84.0.0-*.whl")); assert len(p)==1 and hashlib.sha256(p[0].read_bytes()).hexdigest()=="51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670", "setuptools pinned wheel hash mismatch"'
      - name: Build wheel without installing Home Assistant dependencies
        run: |
          python -m pip install --no-index --no-deps --find-links "$RUNNER_TEMP/build-deps" setuptools==84.0.0
          python -m pip wheel --no-build-isolation --no-deps --no-cache-dir --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Inspect archive and dual command entrypoints without import
        run: python tools/check_home_manager_wheel.py --wheel-dir "$RUNNER_TEMP/wheels"
      - name: Verify isolated installation and generated CLI launchers
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/home-manager-install"
          "$RUNNER_TEMP/home-manager-install/bin/python" -m pip install --disable-pip-version-check --no-index --no-deps --no-compile --no-cache-dir "$RUNNER_TEMP"/wheels/homeassistant-*.whl
          "$RUNNER_TEMP/home-manager-install/bin/python" - <<'PY'
          from importlib import metadata
          from pathlib import Path
          import sys
          dist = metadata.distribution("homeassistant")
          expected = "homeassistant.__main__:main"
          assert dist.version == "2026.11.0"
          assert dist.metadata["Summary"] == "GoreeCloud Home Manager development import of Home Assistant Core."
          assert dist.metadata["License-Expression"] == "Apache-2.0"
          names = {item.name: item.value for item in dist.entry_points if item.group == "console_scripts"}
          assert names.get("hass") == names.get("goreecloud-home-manager") == expected
          assert (Path(dist.locate_file("homeassistant/__main__.py"))).is_file()
          for name in ("hass", "goreecloud-home-manager"):
              launcher = Path(sys.executable).with_name(name)
              assert launcher.is_file() and launcher.stat().st_mode & 0o111
              first_line = launcher.open(encoding="utf-8").readline().strip()
              assert first_line.startswith("#!") and "home-manager-install" in first_line
          assert "homeassistant" not in sys.modules, "upstream code must not be imported by this smoke test"
          print("INSTALL PASS: isolated wheel, package metadata, two CLI launchers")
          print("Scope: no dependencies installed, no Home Assistant service executed")
          PY

  frontend-artifact-smoke:
    # A 117 MB third-party artifact is checked only on this review branch or
    # explicit manual dispatch, not on every push or untrusted fork PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager' && github.head_ref == 'feat/frontend-wheel-provenance-20261108')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed inspector without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select pinned supported Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Download exact upstream frontend wheel with no dependency installs
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/upstream-frontend"
          python -m pip --isolated download --no-input --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/upstream-frontend" 'home-assistant-frontend==20261028.4'
      - name: Verify PyPI pinned SHA-256, Apache-2.0 and inert wheel archive
        run: python tools/check_home_manager_frontend_artifact.py --wheel-dir "$RUNNER_TEMP/upstream-frontend"

  assist-audio-abi3-probe:
    # Two reviewed upstream candidate wheels; only first-party branch/manual runs.
    # No Home Assistant service, device access, user audio, secrets or deployment.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager' && github.head_ref == 'feat/assist-abi3-candidate-smoke-20261108')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fixed-frame bridge without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use supported Python 3.14.10
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Download two pinned Linux ABI3 wheels without dependencies
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/assist-audio-abi3"
          python -m pip --isolated download --no-deps --only-binary=:all: --no-input --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/assist-audio-abi3" 'pymicro-vad==2.1.0' 'pyspeex-noise==2.0.1'
      - name: Verify official PyPI digests and inspect inert ZIP archives
        run: |
          python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          wheel_dir = Path(os.environ["RUNNER_TEMP"]) / "assist-audio-abi3"
          expected = {
              "pymicro_vad-2.1.0-cp39-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl": "a99894b0eb58e713aceff2503ba371e3816801a30b3c60443bd39d22b8699e64",
              "pyspeex_noise-2.0.1-cp39-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl": "bbcc365556bd184ab3da17276dbfadb21485dcd013496889006eb31ffb341c06",
          }
          actual = {p.name for p in wheel_dir.iterdir()}
          assert actual == set(expected), f"unexpected wheels: {actual ^ set(expected)}"
          for name, digest in expected.items():
              wheel = wheel_dir / name
              assert wheel.is_file() and not wheel.is_symlink() and wheel.stat().st_size < 1_000_000
              assert sha256(wheel.read_bytes()).hexdigest() == digest, "pinned PyPI wheel SHA-256 mismatch"
              with ZipFile(wheel) as archive:
                  infos = archive.infolist()
                  names = [item.filename for item in infos]
                  assert len(infos) < 300 and len(set(names)) == len(names)
                  assert all(
                      item.filename and not item.filename.startswith("/")
                      and "\\" not in item.filename
                      and ".." not in PurePosixPath(item.filename).parts
                      for item in infos
                  ), "unsafe wheel path"
                  assert archive.testzip() is None, "corrupted wheel member"
          print("CANDIDATE WHEELS PASS: two exact reviewed Linux ABI3 archives")
          PY
      - name: Test fixed-frame Python API bridge with isolated compiled candidates
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/assist-abi3-venv"
          "$RUNNER_TEMP/assist-abi3-venv/bin/python" -m pip install --no-index --no-deps --no-compile --no-cache-dir "$RUNNER_TEMP"/assist-audio-abi3/*.whl
          HOME="$RUNNER_TEMP" PYTHONNOUSERSITE=1 timeout 25s "$RUNNER_TEMP/assist-abi3-venv/bin/python" - <<'PY'
          import importlib.util
          from importlib import metadata
          import math
          from pathlib import Path
          from pymicro_vad import MicroVad
          from pyspeex_noise import AudioProcessor
          assert metadata.version("pymicro-vad") == "2.1.0"
          assert metadata.version("pyspeex-noise") == "2.0.1"
          source = Path.cwd() / "homeassistant/components/assist_pipeline/audio_compat.py"
          spec = importlib.util.spec_from_file_location("isolated_assist_compat", source)
          assert spec and spec.loader
          bridge = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bridge)
          vad, speex = MicroVad(), AudioProcessor(0, -15)
          silent_10ms = bytes(320)
          for _ in range(5):
              score = bridge.process_vad_chunk(vad, silent_10ms)
              assert isinstance(score, float) and math.isfinite(score) and -1.0 <= score <= 1.0
              clean = bridge.process_speex_chunk(speex, silent_10ms)
              assert isinstance(clean, bytes) and len(clean) == 320
          print("ASSIST ABI3 PASS: Python 3.14, 5 synthetic 10ms frames, both native candidate APIs")
          print("Scope: isolated Linux native smoke only; no real audio, Home Assistant service, device or deployment")
          PY
  direct-core-wheel-metadata-inventory:
    # Read-only PyPI JSON inventory scoped to this reviewed branch or manual dispatch.
    # A successful inventory is NOT proof of dependency installability or runtime readiness.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager' && github.head_ref == 'ci/direct-wheel-metadata-inventory-20261108')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use supported Python 3.14.10
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Inventory direct pinned Core wheels via read-only PyPI release JSON
        run: |
          python tools/audit_direct_core_wheels.py --requirements requirements.txt --report "$RUNNER_TEMP/direct-core-wheels.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "direct-core-wheels.json").read_text())
          assert result["python"] == "3.14.10"
          assert len(result["results"]) == result["requirements"]
          assert result["requirements"] >= 40
          # Known expected gaps from the inherited releases; do not mask or skip.
          results = {item["name"]: item["status"] for item in result["results"]}
          assert results["pymicro-vad"] != "compatible_wheel_metadata"
          assert results["pyspeex-noise"] != "compatible_wheel_metadata"
          print("INVENTORY PASS: complete exact-pin audit, expected legacy audio gaps recorded")
          print("Scope: metadata only; dependency graph, runtime, branding and release remain open")
          PY
  pyturbojpeg-sdist-provenance:
    # Inert, size-bounded source inspection; only explicit/manual or reviewed PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager' && github.head_ref == 'ci/pyturbojpeg-sdist-provenance-20261108')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout read-only source guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact pinned PyTurboJPEG source against its upstream Git tag
        run: python3 tools/check_pyturbojpeg_sdist.py
  pyturbojpeg-controlled-wheel:
    # Only first-party review branch/manual. Build executes a SHA/tag-matched 606-byte
    # upstream setup.py in a disposable hosted runner without Home Assistant deps.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager' && (github.head_ref == 'ci/pyturbojpeg-controlled-wheel-20261108' || github.head_ref == 'ci/pyturbojpeg-synthetic-runtime-20261108'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified upstream-source guard with no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use pinned supported Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Stage four verified PyTurboJPEG source files only
        run: python tools/prepare_pyturbojpeg_wheel_source.py --output-dir "$RUNNER_TEMP/pyturbojpeg-source"
      - name: Download and verify pinned setuptools wheel backend
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/pyturbojpeg-build-backend" "$RUNNER_TEMP/pyturbojpeg-wheel"
          python -m pip --isolated download --no-deps --only-binary=:all: --no-input setuptools==84.0.0 --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/pyturbojpeg-build-backend"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          files = list((Path(os.environ["RUNNER_TEMP"]) / "pyturbojpeg-build-backend").glob("setuptools-84.0.0-*.whl"))
          assert len(files) == 1
          assert hashlib.sha256(files[0].read_bytes()).hexdigest() == "51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670"
          print("BACKEND PASS: reviewed setuptools 84.0.0 wheel matches pinned SHA-256")
          PY
      - name: Build without third-party runtime dependencies from verified setup only
        run: |
          set -eu
          python -m pip install --no-index --no-deps --find-links "$RUNNER_TEMP/pyturbojpeg-build-backend" setuptools==84.0.0
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip wheel --no-build-isolation --no-deps --no-cache-dir --wheel-dir "$RUNNER_TEMP/pyturbojpeg-wheel" "$RUNNER_TEMP/pyturbojpeg-source"
      - name: Inspect result without importing JPEG module or installing wheel
        run: python tools/check_pyturbojpeg_built_wheel.py --wheel-dir "$RUNNER_TEMP/pyturbojpeg-wheel"
      - name: Install distribution-provided libturbojpeg 2.1.5 for synthetic test
        if: github.head_ref == 'ci/pyturbojpeg-synthetic-runtime-20261108'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libturbojpeg
          version=$(dpkg-query -W -f='${Version}' libturbojpeg)
          case "$version" in
            1:2.1.5-*) printf 'LIBTURBOJPEG PASS: Ubuntu 24.04 2.1.5 package\n' ;;
            *) echo 'unexpected libturbojpeg version' >&2; exit 1 ;;
          esac
      - name: Download exact upstream-pinned NumPy CPython 3.14 wheel
        if: github.head_ref == 'ci/pyturbojpeg-synthetic-runtime-20261108'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/numpy-wheel"
          python -m pip --isolated download --no-input --disable-pip-version-check --no-deps --only-binary=:all: --no-cache-dir --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/numpy-wheel" 'numpy==2.3.2'
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"]) / "numpy-wheel"
          files = list(directory.iterdir())
          expected = "numpy-2.3.2-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          assert len(files) == 1 and files[0].name == expected
          assert 10_000_000 < files[0].stat().st_size < 22_000_000
          assert hashlib.sha256(files[0].read_bytes()).hexdigest() == "fed5527c4cf10f16c6d0b6bee1f89958bccb0ad2522c8cadc2efd318bcd545f5"
          print("NUMPY PASS: exact original Core 2.3.2 pin, Linux CPython 3.14 wheel SHA-256")
          PY
      - name: Install verified wheels offline and run synthetic JPEG APIs only
        if: github.head_ref == 'ci/pyturbojpeg-synthetic-runtime-20261108'
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/pyturbojpeg-synthetic-venv"
          "$RUNNER_TEMP/pyturbojpeg-synthetic-venv/bin/python" -m pip install --no-index --no-deps --no-compile --no-cache-dir "$RUNNER_TEMP"/numpy-wheel/*.whl "$RUNNER_TEMP"/pyturbojpeg-wheel/*.whl
          GOREECLOUD_SYNTHETIC_CODEC_CI=1 HOME="$RUNNER_TEMP" PYTHONNOUSERSITE=1 timeout 30s "$RUNNER_TEMP/pyturbojpeg-synthetic-venv/bin/python" tools/smoke_pyturbojpeg_jpeg.py

  core-resolution-candidate-uv:
    # Experiment only. This never rewrites source-managed Core pins or installs Core.
    # Runs on this first-party review branch or manual dispatch; no secrets/devices.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager' && github.head_ref == 'ci/core-resolution-candidate-uv-20261108')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use supported Python 3.14.10
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Stage original source-matched PyTurboJPEG wheel inputs
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/build-backend" "$RUNNER_TEMP/pyturbojpeg-wheel"
          python tools/prepare_pyturbojpeg_wheel_source.py --output-dir "$RUNNER_TEMP/pyturbojpeg-source"
      - name: Download and pin verified build backend and upstream uv solver
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/verified-solver"
          python -m pip --isolated download --no-deps --only-binary=:all: --no-input --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/build-backend" setuptools==84.0.0
          python -m pip --isolated download --no-deps --only-binary=:all: --no-input --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/verified-solver" uv==0.13.6
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          expected = {
              root / "build-backend" / "setuptools-84.0.0-py3-none-any.whl": "51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670",
              root / "verified-solver" / "uv-0.13.6-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "22759b8895e1103578de6fb4cd27e94b4399d021023378d29f01333717751fba",
          }
          for wheel, digest in expected.items():
              assert wheel.is_file() and wheel.stat().st_size < 25_000_000
              assert hashlib.sha256(wheel.read_bytes()).hexdigest() == digest, "candidate backend hash mismatch"
          for subdir in ("build-backend", "verified-solver"):
              assert len(list((root / subdir).iterdir())) == 1, "unexpected installed tool wheel"
          print("RESOLVER TOOLS PASS: exact upstream Core uv 0.13.6 and pinned setuptools hashes")
          PY
      - name: Build source-identical PyTurboJPEG 1.8.3 wheel, no runtime dependencies
        run: |
          set -eu
          python -m pip install --no-index --no-deps --find-links "$RUNNER_TEMP/build-backend" setuptools==84.0.0
          PIP_NO_INDEX=1 PIP_DISABLE_PIP_VERSION_CHECK=1 python -m pip wheel --no-build-isolation --no-deps --no-cache-dir --wheel-dir "$RUNNER_TEMP/pyturbojpeg-wheel" "$RUNNER_TEMP/pyturbojpeg-source"
          python tools/check_pyturbojpeg_built_wheel.py --wheel-dir "$RUNNER_TEMP/pyturbojpeg-wheel"
      - name: Create private two-audio candidate overlay from original pins
        run: |
          python tools/stage_home_manager_resolution_candidate.py --root . --output-dir "$RUNNER_TEMP/core-resolution-candidate"
      - name: Diagnose candidate dependency graph without source builds
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/core-solver"
          "$RUNNER_TEMP/core-solver/bin/python" -m pip install --no-index --no-deps --no-compile --no-cache-dir "$RUNNER_TEMP"/verified-solver/uv-0.13.6-*.whl
          set +e
          UV_NO_CONFIG=1 UV_PYTHON_DOWNLOADS=never UV_NO_CACHE=1 HOME="$RUNNER_TEMP" timeout 160s "$RUNNER_TEMP/core-solver/bin/uv" pip compile \
            --python "$(command -v python)" --python-version 3.14.10 --no-config --no-cache --no-build \
            --index-url https://pypi.org/simple \
            --find-links "$RUNNER_TEMP/pyturbojpeg-wheel" \
            --output-file "$RUNNER_TEMP/core-candidate-lock.txt" \
            "$RUNNER_TEMP/core-resolution-candidate/requirements.in" \
            > "$RUNNER_TEMP/core-candidate-solver.log" 2>&1
          solver_status=$?
          set -e
          if ! python tools/assess_home_manager_resolution_diagnostic.py \
              --status "$solver_status" \
              --solver-log "$RUNNER_TEMP/core-candidate-solver.log" \
              --lock-file "$RUNNER_TEMP/core-candidate-lock.txt" \
              --report "$RUNNER_TEMP/core-candidate-diagnostic.json"; then
            echo "Unexpected candidate solver failure; excerpt (no secrets in public PyPI only)" >&2
            tail -n 25 "$RUNNER_TEMP/core-candidate-solver.log" | cut -c1-300 >&2
            exit 1
          fi
  pyric-source-provenance:
    # Strictly inert inspection of 2016 Linux wireless-control source.
    # No extracted/imported/executed package files; no device permissions.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'GoreeCloud/home-manager' && github.head_ref == 'ci/pyric-source-provenance-20261108')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout read-only inspector with no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect original PyRIC PyPI archive and GPL notice, no extraction
        run: python3 tools/inspect_pyric_sdist.py --report "$RUNNER_TEMP/pyric-source-report.json"
