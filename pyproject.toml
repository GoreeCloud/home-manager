[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant"
version = "2026.11.0"
license = "Apache-2.0"
license-files = ["LICENSE*", "homeassistant/backports/LICENSE*"]
description = "GoreeCloud Home Manager development import of Home Assistant Core."
readme = "README.rst"
authors = [
  { name = "The Home Assistant Authors", email = "hello@home-assistant.io" },
]
maintainers = [
  { name = "GoreeCloud", email = "admin@goreecloud.com" },
]
keywords = ["home", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]
requires-python = ">=3.14.2"
dependencies = [
  "aiodns==4.0.4",
  # aiogithubapi is needed by frontend; frontend is unconditionally imported at
  # module level in `bootstrap.py` and its requirements thus need to be in
  # requirements.txt to ensure they are always installed
  "aiogithubapi==26.0.0",
  "aiohttp==3.14.5",
  "aiohttp_cors==0.8.1",
  "aiohttp-fast-zlib==0.3.0",
  "aiohttp-asyncmdnsresolver==0.2.0",
  "aiozoneinfo==0.2.3",
  "annotatedyaml==1.0.2",
  "astral==2.2",
  "async-interrupt==1.2.2",
  "attrs==26.1.0",
  "atomicwrites-homeassistant==1.4.1",
  "audioop-lts==0.2.2",
  "awesomeversion==25.8.0",
  "bcrypt==5.0.0",
  "certifi>=2021.5.30",
  "ciso8601==2.3.3",
  "cronsim==2.7",
  "fnv-hash-fast==2.0.3",
  # hass-nabucasa is imported by helpers which don't depend on the cloud
  # integration
  "hass-nabucasa==2.8.1",
  # When bumping httpx2, please check the version pins of
  # anyio and h11 in gen_requirements_all
  "httpx2==2.14.0",
  "home-assistant-bluetooth==2.0.0",
  "ifaddr==0.2.0",
  "Jinja2==3.1.6",
  "lru-dict==1.4.1",
  "PyJWT==2.15.1",
  # PyJWT has loose dependency. We want the latest one.
  "cryptography==50.0.2",
  "Pillow==13.0.0",
  "propcache==0.5.4",
  "pyopenssl==26.4.0",
  # We patch pyserial at runtime in `block_shared_serial` and need it to be available
  "pyserial==3.5",
  # Do not bump orjson until the very aggressive buffer resizing introduced in
  # 3.12.0, which causes memory use to balloon, has been adjusted or a workaround
  # is available.
  "orjson==3.13.0",
  "packaging>=23.1",
  "psutil-home-assistant==0.0.1",
  "python-slugify==9.1.3",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "securetar==2026.10.0",
  "SQLAlchemy==2.0.54",
  "standard-aifc==3.13.0",
  "standard-telnetlib==3.13.0",
  # truststore.SSLContext is replaced in homeassistant/__init__.py
  "truststore==0.10.4",
  "typing-extensions>=4.16.0,<5.0",
  "ulid-transform==2.2.9",
  "urllib3>=2.0",
  "uv==0.13.6",
  "probatio==0.13.0",
  "yarl==1.25.1",
  "webrtc-models==0.3.0",
  "zeroconf==0.152.0",
]

[project.urls]
"Homepage" = "https://github.com/GoreeCloud/home-manager"
"Source Code" = "https://github.com/GoreeCloud/home-manager"
"Bug Reports" = "https://github.com/GoreeCloud/home-manager/issues"
"Upstream Developer Docs" = "https://contributors.home-assistant.io/"
"Upstream Community Chat" = "https://www.home-assistant.io/join-chat/"
"Upstream Community Forum" = "https://community.home-assistant.io/"
"Upstream Core Source" = "https://github.com/home-assistant/core"
"Upstream Frontend Source" = "https://github.com/home-assistant/frontend"

[project.scripts]
hass = "homeassistant.__main__:main"
goreecloud-home-manager = "homeassistant.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["homeassistant*"]

[tool.pylint.MAIN]
py-version = "3.14"
# Use a conservative default here; 2 should speed up most setups and not hurt
# any too bad. Override on command line as appropriate.
jobs = 2
init-hook = """\
    from pathlib import Path; \